    <div id="object-popup" style="
      position: fixed;

    ">

    <script type="module">
      import AFRAME from "aframe";
      import { SplatMesh, SparkRenderer } from "@sparkjsdev/spark";

      // expose AFRAME globally for extras + physics
      window.AFRAME = AFRAME;

      // Suppress passive event listener warnings by adding non-passive listeners
      document.addEventListener("touchstart", (e) => {
        // Passive listener - allows default behavior
      }, { passive: true });

      document.addEventListener("touchend", (e) => {
        // Passive listener - allows default behavior
      }, { passive: true });

      // load aframe-extras AFTER AFRAME exists
      await new Promise((resolve) => {
        const s = document.createElement("script");
        s.src =
          "https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js";
        s.onload = resolve;
        document.head.appendChild(s);
      });

      // Raycaster component for hand pointing
      AFRAME.registerComponent("hand-raycaster", {
        init() {
          // Simplified component - just tracks hand state without heavy logic
          this.el.addEventListener("triggerdown", () => {
            console.log("Trigger down");
          });

          this.tick = () => {
            // Minimal tick for performance
          };
        }
      });

      // Spark splat component
      AFRAME.registerComponent("splat", {
        schema: { src: { default: "" } },
        init() {
          const splat = new SplatMesh({ url: this.data.src });
          splat.quaternion.set(1, 0, 0, 0);
          this.el.setObject3D("mesh", splat);
        }
      });

      // Spark renderer system
      AFRAME.registerSystem("splat", {
        init() {
          const sparkRenderer = new SparkRenderer({ renderer: this.el.renderer });
          this.sceneEl.object3D.add(sparkRenderer);
        }
      });

      // Component to hide/show controller visuals based on grab state
      AFRAME.registerComponent("toggle-controller-visibility", {
        init() {
          this.el.addEventListener("grabbed-start", () => {
            this.hideControllerVisuals();
          });
          this.el.addEventListener("grabbed-end", () => {
            this.showControllerVisuals();
          });
        },
        hideControllerVisuals() {
          // Hide the oculus-touch-controls model by setting the hand to invisible
          // But keep the raycaster/grab functionality working
          const controllerChildren = this.el.children;
          for (let child of controllerChildren) {
            child.setAttribute("visible", false);
          }
          // Also hide the controller mesh directly if it exists
          if (this.el.object3D && this.el.object3D.children) {
            this.el.object3D.traverse((node) => {
              if (node.isMesh) {
                node.visible = false;
              }
            });
          }
        },
        showControllerVisuals() {
          // Show the oculus-touch-controls model again
          const controllerChildren = this.el.children;
          for (let child of controllerChildren) {
            child.setAttribute("visible", true);
          }
          // Also show the controller mesh directly if it exists
          if (this.el.object3D && this.el.object3D.children) {
            this.el.object3D.traverse((node) => {
              if (node.isMesh) {
                node.visible = true;
              }
            });
          }
        }
      });

      // Simple grab component for VR controllers
      AFRAME.registerComponent("simple-grab", {
        init() {
          let heldObject = null;
          let originalRot = { x: 0, y: 0, z: 0 };
          let lastHandQuat = new THREE.Quaternion();
          let lastHandPos = new THREE.Vector3();
          let handVelocity = new THREE.Vector3();
          const hand = this.el;

          hand.addEventListener("triggerdown", (e) => {
            const handWorldPos = new THREE.Vector3();
            hand.object3D.getWorldPosition(handWorldPos);

            const grabbables = document.querySelectorAll("[grabbable]");
            let closest = null;
            let closestDist = 3;

            grabbables.forEach((obj) => {
              const objWorldPos = new THREE.Vector3();
              obj.object3D.getWorldPosition(objWorldPos);
              const dist = handWorldPos.distanceTo(objWorldPos);
              if (dist < closestDist) {
                closest = obj;
                closestDist = dist;
              }
            });

            if (closest) {
              heldObject = closest;
              // Store original rotation
              const rot = heldObject.getAttribute("rotation");
              originalRot = { x: rot.x, y: rot.y, z: rot.z };
              
              // Store initial position if not already stored
              if (!heldObject.hasAttribute("data-initial-pos")) {
                const pos = heldObject.getAttribute("position");
                heldObject.setAttribute("data-initial-pos", `${pos.x} ${pos.y} ${pos.z}`);
              }
              
              // Store initial rotation if not already stored
              if (!heldObject.hasAttribute("data-initial-rot")) {
                heldObject.setAttribute("data-initial-rot", `${rot.x} ${rot.y} ${rot.z}`);
              }
              
              // Store initial hand rotation
              hand.object3D.getWorldQuaternion(lastHandQuat);
              lastHandPos.copy(handWorldPos);
              handVelocity.set(0, 0, 0);
              
              heldObject.setAttribute("grabbed", true);
              // Emit event to hide controller visuals
              hand.emit("grabbed-start");
            }
          });

          hand.addEventListener("triggerup", (e) => {
            if (heldObject) {
              heldObject.removeAttribute("grabbed");
              
              // Only apply throw velocity to small objects (not the wheel)
              const isHeavyObject = heldObject.id === "potters-wheel";
              if (!isHeavyObject) {
                // Apply throw velocity to small objects
                heldObject.setAttribute("throw-velocity", handVelocity);
              } else {
                // For wheel, ensure it stays stable - clear any throw attributes
                heldObject.removeAttribute("throw-velocity");
              }
              
              heldObject = null;
              // Emit event to show controller visuals
              hand.emit("grabbed-end");
            }
          });

          this.tick = function() {
            if (heldObject && heldObject.hasAttribute("grabbed")) {
              const handWorldPos = new THREE.Vector3();
              const handWorldQuat = new THREE.Quaternion();
              hand.object3D.getWorldPosition(handWorldPos);
              hand.object3D.getWorldQuaternion(handWorldQuat);

              // Calculate hand velocity
              handVelocity.subVectors(handWorldPos, lastHandPos).multiplyScalar(60); // 60 FPS normalization
              lastHandPos.copy(handWorldPos);

              const isHeavyObject = heldObject.id === "potters-wheel";
              
              if (isHeavyObject) {
                // For heavy objects like the wheel: maintain distance from user
                const camera = document.querySelector("[camera]");
                const cameraWorldPos = new THREE.Vector3();
                camera.object3D.getWorldPosition(cameraWorldPos);
                
                // Direction from camera to hand
                const directionToHand = new THREE.Vector3().subVectors(handWorldPos, cameraWorldPos).normalize();
                
                // Place wheel at distance from camera in the direction of the hand
                const wheelDistance = 1.5; // Distance from user
                const wheelWorldPos = new THREE.Vector3().addVectors(
                  cameraWorldPos,
                  directionToHand.multiplyScalar(wheelDistance)
                );
                
                // Convert to local position relative to wheel's parent
                const localWheelPos = new THREE.Vector3().copy(wheelWorldPos);
                const parent = heldObject.parentEl;
                
                if (parent && parent.object3D) {
                  parent.object3D.worldToLocal(localWheelPos);
                }
                
                const currentPos = heldObject.getAttribute("position");
                heldObject.setAttribute("position", {
                  x: localWheelPos.x,
                  y: currentPos.y, // Keep original height
                  z: localWheelPos.z
                });
              } else {
                // For small objects: follow hand exactly (convert to local position)
                const localHandPos = new THREE.Vector3().copy(handWorldPos);
                const parent = heldObject.parentEl;
                
                if (parent && parent.object3D) {
                  parent.object3D.worldToLocal(localHandPos);
                }
                
                heldObject.setAttribute("position", {
                  x: localHandPos.x,
                  y: localHandPos.y,
                  z: localHandPos.z
                });
              }

              // Calculate rotation delta
              const rotDelta = new THREE.Quaternion().multiplyQuaternions(
                handWorldQuat,
                lastHandQuat.clone().invert()
              );

              // Apply delta to object rotation
              const objRot = heldObject.getAttribute("rotation");
              const objQuat = new THREE.Quaternion();
              objQuat.setFromEuler(new THREE.Euler(
                objRot.x * Math.PI / 180,
                objRot.y * Math.PI / 180,
                objRot.z * Math.PI / 180
              ));

              // Rotate around object center
              objQuat.multiplyQuaternions(rotDelta, objQuat);
              
              let euler = new THREE.Euler().setFromQuaternion(objQuat);
              
              // For heavy objects, only allow Y rotation (revolving around vertical axis)
              if (isHeavyObject) {
                heldObject.setAttribute("rotation", {
                  x: originalRot.x, // Keep original X rotation
                  y: euler.y * 180 / Math.PI, // Only Y rotation allowed
                  z: originalRot.z // Keep original Z rotation
                });
              } else {
                // For small objects: allow full rotation
                heldObject.setAttribute("rotation", {
                  x: euler.x * 180 / Math.PI,
                  y: euler.y * 180 / Math.PI,
                  z: euler.z * 180 / Math.PI
                });
              }

              // Update last hand quaternion for next frame
              lastHandQuat.copy(handWorldQuat);
            }
          };
        }
      });

      // Throw component - applies velocity to thrown objects with reset after 2 seconds
      AFRAME.registerComponent("throw-velocity", {
        schema: { 
          x: { type: "number", default: 0 },
          y: { type: "number", default: 0 },
          z: { type: "number", default: 0 }
        },
        init() {
          this.velocity = new THREE.Vector3(this.data.x, this.data.y, this.data.z);
          this.gravity = -9.8;
          this.isThrown = true;
          this.throwTime = 0;
          this.throwDuration = 2; // 2 seconds before reset
          this.raycaster = new THREE.Raycaster();
          this.raycaster.far = 0.15; // Smaller detection range
          this.lastPos = new THREE.Vector3(0, 0, 0);
          this.checkCollisionCounter = 0;
          
          // Get initial position from stored data attribute
          const initialPosStr = this.el.getAttribute("data-initial-pos");
          if (initialPosStr) {
            const parts = initialPosStr.split(" ");
            this.originalPosition = { x: parseFloat(parts[0]), y: parseFloat(parts[1]), z: parseFloat(parts[2]) };
          } else {
            const pos = this.el.getAttribute("position");
            this.originalPosition = { x: pos.x, y: pos.y, z: pos.z };
          }
          
          // Get initial rotation from stored data attribute
          const initialRotStr = this.el.getAttribute("data-initial-rot");
          if (initialRotStr) {
            const parts = initialRotStr.split(" ");
            this.originalRotation = { x: parseFloat(parts[0]), y: parseFloat(parts[1]), z: parseFloat(parts[2]) };
          } else {
            const rot = this.el.getAttribute("rotation");
            this.originalRotation = { x: rot.x, y: rot.y, z: rot.z };
          }
        },
        tick(time, timeDelta) {
          if (this.isThrown) {
            this.throwTime += timeDelta;
            const deltaSeconds = timeDelta / 1000;
            const pos = this.el.getAttribute("position");
            
            // Check if 2 seconds have passed - reset object
            if (this.throwTime >= this.throwDuration * 1000) {
              this.el.setAttribute("position", this.originalPosition);
              this.el.setAttribute("rotation", this.originalRotation);
              this.isThrown = false;
              this.el.removeAttribute("throw-velocity");
              return;
            }
            
            // Apply velocity with better physics
            const prevY = pos.y;
            pos.x += this.velocity.x * deltaSeconds;
            pos.y += this.velocity.y * deltaSeconds + (this.gravity * deltaSeconds * deltaSeconds) / 2;
            pos.z += this.velocity.z * deltaSeconds;
            
            // Apply gravity
            this.velocity.y += this.gravity * deltaSeconds;
            
            // Only check collision every few frames to avoid getting stuck
            this.checkCollisionCounter++;
            if (this.checkCollisionCounter >= 3) {
              this.checkCollisionCounter = 0;
              
              const currentPos = new THREE.Vector3(pos.x, pos.y, pos.z);
              const scene = this.el.sceneEl.object3D;
              
              // Check collision downward only (for ground)
              const downDir = new THREE.Vector3(0, -1, 0);
              this.raycaster.set(currentPos, downDir);
              const downIntersects = this.raycaster.intersectObjects(scene.children, true);
              
              let groundCollision = false;
              for (let i = 0; i < downIntersects.length; i++) {
                const intersect = downIntersects[i];
                if (intersect.object === this.el.object3D || intersect.object.el === this.el) {
                  continue;
                }
                
                // Only stop downward movement on ground collision
                if (intersect.distance < 0.1 && this.velocity.y < 0) {
                  this.velocity.y = 0; // Stop falling
                  groundCollision = true;
                  break;
                }
              }
            }
            
            // Stop throwing if velocity is very low and falling
            const speed = Math.sqrt(this.velocity.x * this.velocity.x + this.velocity.z * this.velocity.z);
            if (speed < 0.01 && this.velocity.y < 0.1) {
              this.isThrown = false;
              this.el.removeAttribute("throw-velocity");
            }
            
            this.el.setAttribute("position", pos);
            this.lastPos.copy(new THREE.Vector3(pos.x, pos.y, pos.z));
          }
        }
      });

      // Info Display Component - shows object info on the info screen
      AFRAME.registerComponent("info-display", {
        init() {
          this.objectsData = {
            obj1: {
              imageFile: "objects/ozolins_2_fake.png",
              imageId: "info-image-obj1",
              title: "Ceramic Vase",
              description: "A beautiful handcrafted ceramic vase. Rotate to examine the intricate details and craftsmanship of this traditional pottery."
            },
            obj2: {
              imageFile: "objects/ceramic_vase_3d_Krievs.png",
              imageId: "info-image-obj2",
              title: "Vase by Krievs",
              description: "An elegant pottery piece created by master craftsman Krievs. Notice the unique glaze patterns and smooth curves."
            },
            obj3: {
              imageFile: "objects/ceramic_jug_Dranda_2.png",
              imageId: "info-image-obj3",
              title: "Ceramic Jug - Dranda",
              description: "A traditional ceramic jug from the Dranda Collection. Examine the craftsmanship and unique handle design."
            }
          };

          this.currentObject = null;
          this.elementsReady = false;
          this.titleEl = null;
          this.descEl = null;
          this.imageEls = {};

          // Wait for elements to be available
          const self = this;
          const checkElements = () => {
            this.titleEl = document.getElementById("info-title");
            this.descEl = document.getElementById("info-desc");
            this.imageEls = {
              obj1: document.getElementById("info-image-obj1"),
              obj2: document.getElementById("info-image-obj2"),
              obj3: document.getElementById("info-image-obj3")
            };

            if (this.titleEl && this.descEl && this.imageEls.obj1) {
              this.elementsReady = true;
              console.log("Info display elements ready");
            } else {
              setTimeout(checkElements, 100);
            }
          };

          checkElements();

          // Monitor proximity to objects
          this.tick = () => {
            if (!this.elementsReady) return;

            const camera = document.querySelector("[camera]");
            if (!camera) return;

            const cameraPos = new THREE.Vector3();
            camera.object3D.getWorldPosition(cameraPos);

            let closestObject = null;
            let closestDist = Infinity;

            Object.keys(this.objectsData).forEach(objId => {
              const objEl = document.getElementById(objId);
              if (!objEl) return;

              const objPos = new THREE.Vector3();
              objEl.object3D.getWorldPosition(objPos);
              const dist = cameraPos.distanceTo(objPos);

              if (dist < closestDist && dist < 3) {
                closestDist = dist;
                closestObject = objId;
              }
            });

            if (closestObject && closestObject !== this.currentObject) {
              this.updateDisplay(closestObject);
            }
          };
        },

        updateDisplay(objectId) {
          if (!this.objectsData[objectId] || !this.elementsReady) return;

          this.currentObject = objectId;
          const data = this.objectsData[objectId];

          // Update title only (images are always visible now)
          if (this.titleEl) {
            this.titleEl.setAttribute("value", data.title);
          }

          // Update description only (images are always visible now)
          if (this.descEl) {
            this.descEl.setAttribute("value", data.description);
          }
        }
      });

      // Overlay click-to-close handler
      document.getElementById("object-popup-overlay").addEventListener("click", () => {
        document.getElementById("object-popup").style.display = "none";
        document.getElementById("object-popup-overlay").style.display = "none";
      });

      // Asset loading error handler
      const assetLoadingError = (error) => {
        console.error("Asset loading error:", error);
      };

      // create scene AFTER everything is registered
      document.querySelector("#app").innerHTML = `
        <a-scene background="color: black" xr-mode-ui="disabled" vr-mode-ui="disabled">

          <a-assets>
            <a-asset-item id="navmesh-glb" src="objects/Pottery_collider.glb" crossorigin="anonymous" onerror="console.error('Failed to load navmesh')"></a-asset-item>
          </a-assets>

          <!-- Background Music - ONLY loaded and played in VR mode via direct Three.js Audio -->

          <!-- PLAYER (aframe-extras movement) -->
          <a-entity
            id="rig"
            position="0.362 0 0.496"
            rotation="0 47.561 0"
            movement-controls="speed: 0.1 ; constrainToNavMesh: true"
          >
            <a-entity camera look-controls position="0 2.5same 0"></a-entity>

            <a-entity id="leftHand" 
              oculus-touch-controls="hand: left"
              simple-grab
              hand-raycaster>
            </a-entity>
            <a-entity id="rightHand" 
              oculus-touch-controls="hand: right"
              simple-grab
              hand-raycaster>
            </a-entity>
          </a-entity>

          <!-- WORLD -->
          <a-entity
            id="world-container"
            position="0 -0.1 0"
            rotation="180 0 0"
            scale="2 2 2"
          >

<!-- NAVMESH (aframe-extras) -->
<a-entity 
gltf-model="objects/Pottery_collider.glb"

position="0 -2.76169 3.5693"

</a-entity>

<a-entity

visible="false"
></a-entity>

<!-- SPLAT -->
<a-entity
splat="src: objects/pottery.spz" 
scale="1 0.7 1">
</a-entity>

    <!-- POTTERY WHEEL AND VASE -->
    <a-entity id="wheel-container" position="-0.58 -0.5 0.58">
    <a-entity id="potters-wheel" 
    gltf-model="objects/potters_wheel.glb" 
    position="-0.0065 -0.04283 2.90938" 
    scale="0.9 0.9 0.9" 
    rotation="0 180 0"
    grabbable=""
    data-title="Potter's Wheel"
    data-description="The potter's wheel - push and pull to move it around, rotate to change its orientation.">
    </a-entity>
    </a-entity>

          </a-entity>

          </a-entity>

        <!-- GRABBABLE OBJECTS at scene root -->
<a-entity 
gltf-model="objects/ozolins_2_fake.glb"

</a-entity>

<a-entity

position="-2.19451 1.26547 -2.01672"

</a-entity>

</a-entity>

      `;

      // Wait for scene to be ready before setting up event listeners
      setTimeout(() => {
        const scene = document.querySelector("a-scene");
        if (!scene) {
          console.error("Scene not found");
          return;
        }

        // Clean up any existing VR sessions on page load
        if (scene.is("vr-mode")) {
          console.log("Existing VR session detected, exiting...");
          scene.exitVR().catch(e => console.log("Could not exit existing VR:", e));
        }

        // Handle WebGL context loss/restore
        const canvas = scene.canvas;
        if (canvas) {
          canvas.addEventListener("webglcontextlost", (event) => {
            console.log("WebGL context lost - preventing default behavior");
            event.preventDefault();
          }, false);

          canvas.addEventListener("webglcontextrestored", () => {
            console.log("WebGL context restored");
          }, false);
        }

        // VR Button Handler
        let vrTransitioning = false;
        document.getElementById("vr-button").addEventListener("click", () => {
          if (vrTransitioning) {
            console.log("VR transition already in progress");
            return;
          }

          // Check if already in VR mode
          if (scene.is("vr-mode")) {
            console.log("Already in VR mode, exiting VR");
            scene.exitVR();
            return;
          }

          console.log("VR button clicked");
          vrTransitioning = true;
          
          const attemptVREntry = (retries = 0) => {
            scene.enterVR().then(() => {
              console.log("Successfully entered VR mode");
              vrTransitioning = false;
            }).catch((error) => {
              console.error("VR entry failed:", error);
              console.log("Error message:", error.message);
              
              // Retry on context loss errors
              if (error.message.includes("InvalidStateError") && retries < 2) {
                console.log("Context lost during VR entry, retrying... (attempt " + (retries + 1) + "/2)");
                setTimeout(() => attemptVREntry(retries + 1), 500);
                return;
              }
              
              vrTransitioning = false;
              
              // Provide user feedback
              if (error.message.includes("No runtimes supported")) {
                alert("VR not supported or not properly configured. Make sure:\n1. WebXR is enabled in your browser\n2. VR headset is connected and detected\n3. VR runtime is installed");
              } else if (error.message.includes("NotSupportedError")) {
                alert("The specified XR configuration is not supported by your device.");
              } else if (error.message.includes("already an active")) {
                alert("VR session already active. Please exit the current session first.");
              } else if (error.message.includes("InvalidStateError")) {
                alert("Graphics context lost during VR initialization. Please try again.");
              } else {
                alert("Failed to enter VR mode: " + error.message);
              }
            });
          };
          
          attemptVREntry();
        });

        // Hide welcome text and start audio when entering VR
        scene.addEventListener("enter-vr", () => {
          isInVRMode = true;
          document.getElementById("welcome-text").style.display = "none";
          console.log("Entered VR mode, isInVRMode = true");
          
          // Delay audio start to ensure immersive context is fully initialized
          setTimeout(() => {
            playAudioInVR();
          }, 500);
        });

        // Helper to actually play the audio using direct Three.js Audio
        let vrAudio = null;
        let vrAudioListener = null;
        let isInVRMode = false;
        
        const playAudioInVR = () => {
          console.log("[AUDIO] playAudioInVR called, isInVRMode =", isInVRMode);
          
          if (!isInVRMode) {
            console.log("[AUDIO] ❌ Not in VR mode, skipping audio");
            return;
          }

          if (!scene.is("vr-mode")) {
            console.log("[AUDIO] ❌ Scene not in vr-mode, skipping audio");
            return;
          }

          console.log("[AUDIO] ✅ In VR mode - getting camera");
          
          const camera = document.querySelector("[camera]");
          if (!camera || !camera.components.camera) {
            console.error("[AUDIO] ❌ Camera not found");
            return;
          }

          const threeCamera = camera.components.camera.camera;
          if (!threeCamera) {
            console.error("[AUDIO] ❌ Three.js camera not found");
            return;
          }

          // Create audio listener attached to THREE camera
          // This routes audio to immersive XR session only
          vrAudioListener = new THREE.AudioListener();
          threeCamera.add(vrAudioListener);
          
          console.log("[AUDIO] ✅ Audio listener created and attached to VR camera");
          console.log("[AUDIO] Audio context state:", vrAudioListener.context.state);

          // Resume audio context if needed
          if (vrAudioListener.context.state === "suspended") {
            console.log("[AUDIO] 🔄 Resuming suspended audio context");
            vrAudioListener.context.resume().then(() => {
              console.log("[AUDIO] ✅ Audio context resumed, starting playback");
              createAndPlayAudio(vrAudioListener);
            }).catch(e => console.error("[AUDIO] ❌ Failed to resume context:", e));
          } else {
            createAndPlayAudio(vrAudioListener);
          }
        };

        const createAndPlayAudio = (audioListener) => {
          console.log("[AUDIO] createAndPlayAudio called");
          
          if (!isInVRMode) {
            console.log("[AUDIO] ❌ VR mode ended, aborting");
            return;
          }

          if (!scene.is("vr-mode")) {
            console.log("[AUDIO] ❌ Not in vr-mode, aborting");
            return;
          }

          console.log("[AUDIO] ✅ Creating THREE.Audio with VR listener");
          
          // Stop old audio if any
          if (vrAudio) {
            try { vrAudio.stop(); } catch(e) {}
            vrAudio = null;
          }

          // Create new THREE.Audio with the VR listener
          vrAudio = new THREE.Audio(audioListener);
          
          // Load audio buffer using THREE.AudioLoader
          console.log("[AUDIO] Loading audio file...");
          const audioLoader = new THREE.AudioLoader();
          audioLoader.load("objects/Ej_projam_ledutinu.mp3", (audioBuffer) => {
            console.log("[AUDIO] ✅ Audio buffer loaded, duration:", audioBuffer.duration, "s");
            
            // Final VR mode checks before playing
            if (!isInVRMode || !scene.is("vr-mode")) {
              console.log("[AUDIO] ❌ VR mode ended, not playing audio");
              return;
            }

            if (!vrAudio) {
              console.log("[AUDIO] ❌ Audio object was cleared, not playing");
              return;
            }

            try {
              vrAudio.setBuffer(audioBuffer);
              vrAudio.setLoop(true);
              vrAudio.setVolume(1.0);
              vrAudio.play();
              console.log("[AUDIO] 🔊 AUDIO PLAYING - routed to active audio output (headset if in immersive VR)");
            } catch(e) {
              console.error("[AUDIO] ❌ Error playing audio:", e);
            }
          }, (progress) => {
            if (progress.total > 0) {
              const percent = (progress.loaded / progress.total * 100).toFixed(1);
              if (percent % 10 === 0) { // Log every 10%
                console.log("[AUDIO] Loading: " + percent + "%");
              }
            }
          }, (error) => {
            console.error("[AUDIO] ❌ Load error:", error);
          });
        };

        // Show welcome text and stop audio when exiting VR
        scene.addEventListener("exit-vr", () => {
          isInVRMode = false;
          document.getElementById("welcome-text").style.display = "block";
          console.log("Exited VR mode, isInVRMode = false");
          
          // Stop audio when exiting VR mode
          stopAudio();
        });

        // Function to stop audio
        const stopAudio = () => {
          console.log("[AUDIO] stopAudio called");
          
          if (vrAudio) {
            try {
              vrAudio.stop();
              console.log("[AUDIO] ✅ Audio stopped");
            } catch(e) {
              console.log("[AUDIO] Error stopping audio:", e.message);
            }
            vrAudio = null;
          }
          
          if (vrAudioListener) {
            // Remove listener from camera
            const camera = document.querySelector("[camera]");
            if (camera && camera.components.camera && camera.components.camera.camera) {
              const threeCamera = camera.components.camera.camera;
              try {
                threeCamera.remove(vrAudioListener);
                console.log("[AUDIO] ✅ Audio listener removed from camera");
              } catch(e) {
                console.log("[AUDIO] Error removing listener:", e.message);
              }
            }
            vrAudioListener = null;
          }
        };

        // ESC key handler - stop audio when in VR mode
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            console.log("ESC key pressed");
            if (scene.is("vr-mode")) {
              console.log("Stopping audio and exiting VR mode");
              stopAudio();
              scene.exitVR();
            }
          }
        });
      }, 100);
    </script>
  </body>
</html>
