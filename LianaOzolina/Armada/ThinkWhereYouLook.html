<!--Scripts-->
<script>
AFRAME.registerComponent('click-to-shoot', {
  init: function () {
    document.body.addEventListener('mousedown', () => {
    this.el.emit('shoot');
  });
  }
  });


  // Change color when hit + die + respawn
    AFRAME.registerComponent('hit-handler', {
    schema: {
    points: { type: 'int', default: 1 },
    respawn: { type: 'boolean', default: true },
    respawnDelay: { type: 'int', default: 10000 }
    },
    dependencies: ['material'],

    init: function () {
    const el = this.el;
    const color = new THREE.Color();
    let dead = false;
    let active = false;
    let gameRunning = false; // authoritative flag

    // Start inactive
    el.setAttribute('visible', false);
    el.classList.remove('enemy');

    // Game start
    el.sceneEl.addEventListener('game-start', () => {
      gameRunning = true;
      active = true;
      dead = false;

      el.setAttribute('visible', true);
      el.classList.add('enemy');
      el.play();
    });

    // Game end
    el.sceneEl.addEventListener('game-end', () => {
      gameRunning = false;
      active = false;
      dead = false;

      el.setAttribute('visible', false);
      el.classList.remove('enemy');
      el.pause();
    });

    // Hit
    el.addEventListener('hit', () => {
      if (!gameRunning || !active || dead) return;
      color.addScalar(0.05);
      el.components.material.material.color.copy(color);
    });

    // Die
    el.addEventListener('die', () => {
      if (!gameRunning || !active || dead) return;
      dead = true;

      el.sceneEl.emit('score', { points: this.data.points });

      el.setAttribute('visible', false);
      el.classList.remove('enemy');
      el.pause();

      // Conditional respawn
      if (!this.data.respawn) return;

      setTimeout(() => {
        // Abort if game is no longer running
        if (!gameRunning) return;

        dead = false;
        el.setAttribute('visible', true);
        el.classList.add('enemy');
        el.play();
      }, this.data.respawnDelay);
    });
  }
});


// Score system
AFRAME.registerComponent('score-keeper', {
  init: function () {
    this.score = 0;
    this.el.setAttribute('text', 'value', '0');

    this.el.sceneEl.addEventListener('game-start', () => {
    this.score = 0;
    this.el.setAttribute('text', 'value', '0');
    });

    this.el.sceneEl.addEventListener('score', (evt) => {
      const points = evt.detail?.points ?? 1; // default +1
      this.score += points;
      this.el.setAttribute('text', 'value', `${this.score}`);
    });
  }
});


// Start Game Target
AFRAME.registerComponent('start-game-target', {
  init: function () {
    const el = this.el;
    let active = true;

    el.classList.add('enemy');

    el.addEventListener('die', () => {
      if (!active) return;
      active = false;

      el.sceneEl.emit('game-start');

      el.setAttribute('visible', false);
      el.classList.remove('enemy');
      el.pause();
    });

    // Reappear after game ends
    el.sceneEl.addEventListener('game-end', () => {
      active = true;
      el.setAttribute('visible', true);
      el.classList.add('enemy');
      el.play();
    });
  }
});


//Game timer
AFRAME.registerComponent('game-timer', {
  schema: {
    duration: { type: 'int', default: 60 } // seconds
  },

  init: function () {
    this.timeout = null;

    this.el.sceneEl.addEventListener('game-start', () => {
      // Clear previous timer if any
      if (this.timeout) clearTimeout(this.timeout);

      // Start countdown
      this.timeout = setTimeout(() => {
        this.el.sceneEl.emit('game-end');
      }, this.data.duration * 1000);
    });
  }
});


//Rotate Sky
AFRAME.registerComponent('rotate-on-game', {
  schema: {
    duration: { type: 'int', default: 10000 } // ms
  },

  init: function () {
    const el = this.el;

    el.sceneEl.addEventListener('game-start', () => {
      el.setAttribute('animation', {
        property: 'rotation',
        from: '0 0 0',
        to: '0 0 360',
        dur: this.data.duration,
        easing: 'easeInOutQuad'
      });
    });

    el.sceneEl.addEventListener('game-end', () => {
      el.removeAttribute('animation');
      el.setAttribute('rotation', '0 0 0');
    });
  }
});

//Alarm Sound
AFRAME.registerComponent('game-sounds', {
  init() {
    const alarm = document.querySelector('#alarmSound');

    this.el.sceneEl.addEventListener('game-start', () => {
      alarm.components.sound.playSound();
    });

    this.el.sceneEl.addEventListener('game-end', () => {
      alarm.components.sound.stopSound();
    });
  }
});

</script>
