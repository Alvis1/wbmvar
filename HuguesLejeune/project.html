<html>
    <head>
        <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
        <script src="https://unpkg.com/aframe-event-set-component@5/dist/aframe-event-set-component.min.js"></script>

        <script src="components/a-cursor-navigation.js"></script>
        <script src="components/toggle-click-animation.js"></script>
        <script src="components/rotate-to-follow.js"></script>
    </head>
    <body>
        <a-scene>
            <a-assets>
                <img id="forest-panorama" src="images/forest-panorama.jpg" />
            </a-assets>
            <a-assets>
                <a-asset-item id="brown-bear" src="objects/brown-bear.glb">
                </a-asset-item>
            </a-assets>
            <a-assets>
                <a-asset-item id="pine-tree" src="objects/pine-tree.glb">
                </a-asset-item>
            </a-assets>
            <a-assets>
                <a-asset-item id="oak-trees" src="objects/oak-trees.glb">
                </a-asset-item>
            </a-assets>

            <a-entity
                position="0 0 0"
                id="cameraRig"
                movement-controls="speed: 1.01; enabled:false"
                a-cursor-teleport="cameraRig: #cameraRig; cameraHead: #head"
            >
                <a-entity
                    id="head"
                    position="0 1.6 0"
                    camera="near: 0.1"
                    look-controls="reverseMouseDrag: false"
                >
                    <a-cursor
                        color="white"
                        position="0 0 -0.1"
                        scale="0.1 0.1 0.1"
                    ></a-cursor>
                </a-entity>
                <a-entity
                    id="leftHand"
                    hand-tracking-grab-controls="hand: left;"
                ></a-entity>
                <a-entity
                    id="rightHand"
                    hand-tracking-grab-controls="hand: right;"
                ></a-entity>
            </a-entity>

            <a-sky src="#forest-panorama" rotation="0 -90 0"></a-sky>

            <a-plane
                navmesh
                position="2.5 0 -2.5"
                rotation="-90 0 0"
                width="6"
                height="6"
                color="#7BC8A4"
                material="opacity: 0.0; transparent: true"
            ></a-plane>
            <a-entity
                position="2.5 0 -2.5"
                line="start: -3 0.01 -3; end: 3 0.01 -3; color: #ff0000"
                line__2="start: 3 0.01 -3; end: 3 0.01 3; color: #ff0000"
                line__3="start: 3 0.01 3; end: -3 0.01 3; color: #ff0000"
                line__4="start: -3 0.01 3; end: -3 0.01 -3; color: #ff0000"
            ></a-entity>

            <a-entity
                gltf-model="#brown-bear"
                position="2.5 0 -2.8"
                scale="0.02 0.02 0.02"
                animation-mixer="clampWhenFinished: true"
            ></a-entity>

            <a-sphere
                position="2.5 1.8 -2.6"
                radius="0.04"
                color="#34eae7"
                event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                event-set__leave="_event: mouseleave; scale: 1 1 1"
                toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                toggle-click-target-animation__plane="name: plane; target: #general-info; property: material.opacity; from: 0; to: 1; dur: 300"
                toggle-click-target-animation__text="name: text; target: #general-info; property: text.opacity; from: 0; to: 1; dur: 300"
            ></a-sphere>

            <a-plane
                id="general-info"
                position="2.5 2.8 -2.6"
                width="2.4"
                height="1.4"
                color="#fff"
                material="opacity: 0; transparent: true"
                rotate-to-follow-y="target: #cameraRig"
                text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0;
                    value: - Brown Bear (Ursus arctos)
                    - Large omnivorous mammal found in North America, Europe, and Asia.
                    - Can weigh between 300-700 kg and reach 2-3 meters in length.
                    - Primarily solitary, except mothers with cubs.
                    - Excellent sense of smell, stronger than a bloodhound."
            ></a-plane>

            <a-entity gltf-model="#pine-tree" position="1.5 0 0" scale="3 3 3">
            </a-entity>
            <a-entity
                gltf-model="#pine-tree"
                position="3.7 0 -1.3"
                scale="1.8 1.8 1.8"
            ></a-entity>
            <a-entity
                gltf-model="#pine-tree"
                position="3 0 -5"
                scale="2.4 2.4 2.4"
            ></a-entity>
        </a-scene>
    </body>
</html>
