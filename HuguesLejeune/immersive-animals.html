<html>
    <head>
        <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>
        <script src="https://unpkg.com/aframe-event-set-component@5/dist/aframe-event-set-component.min.js"></script>

        <script src="components/a-cursor-navigation.js"></script>
        <script src="components/toggle-click-animation.js"></script>
        <script src="components/rotate-to-follow.js"></script>
        <script src="components/play-sound-randomly.js"></script>
    </head>
    <body>
        <a-scene>
            <a-assets>
                <img id="forest-panorama" src="images/forest-panorama.jpg" />
            </a-assets>
            <a-assets>
                <img id="forest-floor" src="images/forest-floor.jpg" />
            </a-assets>
            <a-assets>
                <a-asset-item id="brown-bear" src="objects/brown-bear.glb">
                </a-asset-item>
            </a-assets>
            <a-assets>
                <a-asset-item id="pine-tree" src="objects/pine-tree.glb">
                </a-asset-item>
            </a-assets>
            <a-assets>
                <a-asset-item id="oak-trees" src="objects/oak-trees.glb">
                </a-asset-item>
            </a-assets>
            <a-assets>
                <audio id="bear-grunt" src="sounds/bear-grunt.m4a" preload="auto">
                </audio>
            </a-assets>
            <a-assets>
                <audio id="forest-ambience" src="sounds/forest-ambience.mp3" preload="auto">
                </audio>
            </a-assets>

            <a-entity
                position="0 0 0"
                id="cameraRig"
                movement-controls="speed: 1.01; enabled:false"
                a-cursor-teleport="cameraRig: #cameraRig; cameraHead: #head"
            >
                <a-entity
                    id="head"
                    position="0 1.6 0"
                    camera="near: 0.1"
                    look-controls="reverseMouseDrag: false"
                >
                    <a-cursor
                        color="white"
                        position="0 0 -0.1"
                        scale="0.1 0.1 0.1"
                    ></a-cursor>
                </a-entity>
                <a-entity
                    id="leftHand"
                    hand-tracking-grab-controls="hand: left;"
                ></a-entity>
                <a-entity
                    id="rightHand"
                    hand-tracking-grab-controls="hand: right;"
                ></a-entity>
            </a-entity>

            <a-sky src="#forest-panorama" rotation="0 -90 0"></a-sky>
            <a-entity
                sound="src: #forest-ambience; autoplay: true; loop: true; volume: 0.3"
            ></a-entity>

            <a-entity position="2.5 0 -2.5">
                <a-plane
                    navmesh
                    rotation="-90 0 0"
                    width="10"
                    height="10"
                    material="src: #forest-floor"
                ></a-plane>
                <a-plane
                    position="0 0.01 0"
                    rotation="-90 0 0"
                    width="1.2"
                    height="2.8"
                    material="opacity: 0; transparent: true;"
                ></a-plane>
                <a-plane
                    position="0 -0.01 0"
                    rotation="-90 0 0"
                    width="50"
                    height="50"
                    material="src: #forest-floor; opacity: 0.4; transparent: true"
                ></a-plane>
                <a-plane
                    position="0 -0.02 0"
                    rotation="-90 0 0"
                    width="50"
                    height="50"
                    color="#7e572a"
                ></a-plane>
            </a-entity>

            <a-entity
                gltf-model="#brown-bear"
                position="2.5 0 -2.8"
                scale="0.02 0.02 0.02"
                animation-mixer="clampWhenFinished: true"
            ></a-entity>
            <a-entity
                sound="src: #bear-grunt; volume: 0.6"
                play-sound-randomly="minInterval: 15000; maxInterval: 90000;"
            ></a-entity>

            <a-entity position="2.5 0 -2.6">
                <a-sphere
                    position="0 1.8 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #general; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #general; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane
                    class="bear-info"
                    id="general"
                    position="0 2.8 0"
                    width="2.4"
                    height="1.4"
                    color="#fff"
                    material="opacity: 0; transparent: true"
                    rotate-to-follow-y="target: #cameraRig"
                    text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0"
                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity position="2.26 0 -2.1">
                <a-sphere
                    position="0 0.23 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #claws; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #claws; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane
                    class="bear-info"
                    id="claws"
                    position="0 2.8 0"
                    width="2.4"
                    height="1.4"
                    color="#fff"
                    material="opacity: 0; transparent: true"
                    rotate-to-follow-y="target: #cameraRig"
                    text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0"
                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity position="2.47 0 -1.36">
                <a-sphere
                    position="0 1.1 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #jaws; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #jaws; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane
                    class="bear-info"

                    position="0 2.8 0"
                    width="2.4"
                    height="1.4"
                    color="#fff"
                    material="opacity: 0; transparent: true"
                    rotate-to-follow-y="target: #cameraRig"
                    text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0"
                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity position="2 0 -2.8">
                <a-sphere
                    position="0 1.3 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #fur; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #fur; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane
                    class="bear-info"
                    id="fur"
                    position="0 2.8 0"
                    width="2.4"
                    height="1.4"
                    color="#fff"
                    material="opacity: 0; transparent: true"
                    rotate-to-follow-y="target: #cameraRig"
                    text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0"
                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity position="2.75 0 -1.7">
                <a-sphere
                    position="0 1.84 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #ears; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #ears; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane

                    text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0"
                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity position="3.1 0 -1.4">
                <a-sphere
                    position="0 1.55 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #eyes; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #eyes; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane
                    class="bear-info"
                    id="eyes"
                    position="0 2.8 0"
                    width="2.4"
                    height="1.4"
                    color="#fff"
                    material="opacity: 0; transparent: true"
                    rotate-to-follow-y="target: #cameraRig"
                    text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0"
                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity position="2 0 -1">
                <a-sphere
                    position="0 1.5 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #nose; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #nose; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane
                    class="bear-info"
                    id="nose"
                    position="0 2.8 0"

                    color="#fff"

                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity position="2.9 0 -3.4">
                <a-sphere
                    position="0 0.14 0"
                    radius="0.04"
                    color="#34eae7"
                    event-set__enter="_event: mouseenter; scale: 1.6 1.6 1.6"
                    event-set__leave="_event: mouseleave; scale: 1 1 1"
                    toggle-click-animation="property: color; from: #34eae7; to: #fd8f35; dur: 300"
                    toggle-panel-visibility__plane="name: plane; target: #paws; property: material.opacity; from: 0; to: 1; dur: 300"
                    toggle-click-target-animation__text="name: text; target: #paws; property: text.opacity; from: 0; to: 1; dur: 300"
                ></a-sphere>

                <a-plane
                    class="bear-info"
                    id="paws"
                    position="0 2.8 0"
                    width="2.4"
                    height="1.4"
                    color="#fff"
                    material="opacity: 0; transparent: true"
                    rotate-to-follow-y="target: #cameraRig"
                    text="color: #000; align: center; width: 2.2; lineHeight: 60; opacity: 0"
                    visible="false"
                ></a-plane>
            </a-entity>

            <a-entity gltf-model="#pine-tree" position="15 0 0" scale="5 5 5">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="-19 0 17" scale="10 10 10">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="-2 0 3" scale="3 3 3">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="-1 0 -12" scale="8 8 8">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="-20 0 -11" scale="7 7 7">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="23 0 -17" scale="12 12 12">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="-12 0 -23" scale="4 4 4">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="3 0 -18" scale="6 6 6">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="0 0 -27" scale="9 9 9">
            </a-entity>
            <a-entity gltf-model="#pine-tree" position="12 0 8" scale="5 5 5">
            </a-entity>
            <a-entity
                gltf-model="#oak-trees"
                position="-10 0 13"
                scale="10 10 10"
                rotation="0 45 0"
            ></a-entity>
            <a-entity
                gltf-model="#oak-trees"
                position="-14 0 -16"
                scale="12 12 12"
                rotation="0 30 0"
            ></a-entity>
            <a-entity
                gltf-model="#oak-trees"
                position="10 0 1"
                scale="8 8 8"
                rotation="0 -20 0"
            ></a-entity>
            <a-entity
                gltf-model="#oak-trees"
                position="13 0 -23"
                scale="15 15 15"
                rotation="0 15 0"
            ></a-entity>
            <a-entity
                gltf-model="#oak-trees"
                position="25 0 12"
                scale="13 13 13"
                rotation="0 -30 0"
            ></a-entity>
            <a-entity
                gltf-model="#oak-trees"
                position="20 0 -6"
                scale="11 11 11"
                rotation="0 45 0"
            ></a-entity>
        </a-scene>
    </body>

    <script src="utils/add-bear-info.js"></script>
</html>
